name: Applications checks

on:
  push:
    branches: [feat/176-applications-view]
  pull_request:
    paths: ['src/**', 'tests/ApplicationsChecks/**', '.github/workflows/applications-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
      # COM reference generation requires Windows and full-framework MSBuild.
      - run: msbuild tests/ApplicationsChecks/ApplicationsChecks.csproj /restore /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - run: dotnet tests/ApplicationsChecks/bin/x64/Release/net10.0-windows8.0/win-x64/ApplicationsChecks.dll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applications-screenshots
          path: artifacts/applications/*.png
