[tools]
dotnet = "10.0"

[tasks.install-buildtools]
description = "Install Visual Studio Build Tools (.NET desktop) if MSBuild is missing"
shell = "powershell.exe -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
if ((Test-Path $vswhere) -and (& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe')) {
    Write-Host 'Visual Studio MSBuild already installed.'
    exit 0
}
winget install --id Microsoft.VisualStudio.BuildTools --accept-package-agreements --accept-source-agreements --override "--passive --wait --add Microsoft.VisualStudio.Workload.ManagedDesktopBuildTools --add Microsoft.Net.Component.4.8.SDK --includeRecommended"
exit $LASTEXITCODE
'''

[tasks.build]
description = "Build Minimal Firewall for Windows x64 (Release)"
run = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/msbuild.ps1 src/MinimalFirewall.csproj /restore /p:Configuration=Release /p:Platform=x64 /verbosity:minimal"

[tasks.publish]
description = "Publish the production single-file MinimalFirewall.exe to artifacts/publish"
run = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/msbuild.ps1 src/MinimalFirewall.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:PublishDir=../artifacts/publish/ /p:DebugType=none /verbosity:minimal"

[tasks.install-local]
description = "Replace the winget-installed MinimalFirewall.exe with artifacts/publish (keeps the original as MinimalFirewall.exe.old)"
depends = ["publish"]
shell = "powershell.exe -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$dir = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Directory -Filter 'Deminimis.MinimalFirewall_*' | Select-Object -First 1
if (!$dir) { throw 'No winget installation of Minimal Firewall was found.' }
if (Get-Process MinimalFirewall -ErrorAction SilentlyContinue) { throw 'Minimal Firewall is running. Exit it from the tray menu first.' }
$target = Join-Path $dir.FullName 'MinimalFirewall.exe'
# Keep the first backup so repeated installs never overwrite the original winget build.
if ((Test-Path $target) -and !(Test-Path "$target.old")) { Move-Item $target "$target.old" }
Copy-Item 'artifacts/publish/MinimalFirewall.exe' $target
Write-Host "Installed to $target (original kept as MinimalFirewall.exe.old)."
'''
