[tools]
dotnet = "10.0"

[tasks.install-buildtools]
description = "Install Visual Studio Build Tools (.NET desktop) if MSBuild is missing"
shell = "powershell.exe -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
if ((Test-Path $vswhere) -and (& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe')) {
    Write-Host 'Visual Studio MSBuild already installed.'
    exit 0
}
winget install --id Microsoft.VisualStudio.BuildTools --accept-package-agreements --accept-source-agreements --override "--passive --wait --add Microsoft.VisualStudio.Workload.ManagedDesktopBuildTools --add Microsoft.Net.Component.4.8.SDK --includeRecommended"
exit $LASTEXITCODE
'''

[tasks.build]
description = "Build Minimal Firewall for Windows x64 (Release)"
shell = "powershell.exe -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$msbuild = Get-Command MSBuild.exe -ErrorAction SilentlyContinue
if ($msbuild) {
    $msbuildPath = $msbuild.Source
} else {
    $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
    if (!(Test-Path $vswhere)) {
        throw 'Install Visual Studio 2026 or Build Tools with the .NET desktop development workload.'
    }
    $msbuildPath = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
    if (!$msbuildPath) { throw 'Visual Studio MSBuild.exe was not found.' }
}
& $msbuildPath src/MinimalFirewall.csproj /restore /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
exit $LASTEXITCODE
'''
